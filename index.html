<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD Тех.задание для верстальщика</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/main.js"></script>
</head>
<body>
    <main class="main">
        <section class="card">
            <div class="card__wrapper">
                <div class="card__list">
                    <div class="card__item">
                        <div class="card__image">
                            <img src="./images/product_image.png" alt="Volvo XC40">
                        </div>
                        <div class="card__text">
                            <div class="card__top">
                                <h1 class="card__title">Volvo XC40
                                    <span>2024</span>
                                </h1>
                                <div class="card__sale">
                                    Скидка 200 000 ₽
                                </div>
                            </div>
                            <div class="info__list">
                                <div class="info__item">
                                    <p class="info__title">
                                        Бензин, 180 л.с.
                                    </p>
                                    <p class="info__text">
                                        2.0 л
                                    </p>
                                </div>
                                <div class="info__item">
                                    <p class="info__title">
                                        Передний
                                    </p>
                                    <p class="info__text">
                                        4х2
                                    </p>
                                </div>
                                <div class="info__item">
                                    <p class="info__title">
                                        6 ступений
                                    </p>
                                    <p class="info__text">
                                        АКПП
                                    </p>
                                </div>
                                <div class="info__item">
                                    <p class="info__title">
                                        Стоимость
                                    </p>
                                    <p class="info__text active">
                                        5 131 000 ₽
                                    </p>
                                </div>

                            </div>
                        </div>
                        <button class="card__btn">
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div class="modal">
        <div class="modal__overlay"></div>
        <div class="modal__wrapper">
            <button class="modal__close">
                <span></span><span></span>
            </button>
        <div class="modal__image">
            <img src="./images/logo.svg" alt="Логотип" loading="lazy">
        </div>
        <div class="modal__info">
            <h2 class="modal__title">Ваша заявка отправлена!</h2>
            <p class="modal__text">
                Спасибо за обращение! Мы свяжемся с вами в ближайшее время
            </p>
        </div>
        <button class="modal__btn">
            Вернуться в каталог
        </button>
        </div>
    </div>
</body>
</html>
